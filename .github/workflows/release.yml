name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: pnpm run release:validate

      - name: Generate extension bridge
        run: pnpm run ext:bridge

      - name: Validate source
        run: |
          pnpm run typecheck
          pnpm run lint:check
          pnpm test
          pnpm run build:vite

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm

      - name: Use HTTPS for public GitHub dependencies
        shell: bash
        run: |
          git config --global "url.https://github.com/.insteadOf" "git@github.com:"
          git config --global --add "url.https://github.com/.insteadOf" "ssh://git@github.com/"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download bundled tools
        shell: bash
        run: |
          pnpm run uv:download:${{ matrix.platform }}
          pnpm run agent-browser:download:${{ matrix.platform }}

      - name: Build macOS packages
        if: matrix.platform == 'mac'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENX_MAC_CERTS: ${{ secrets.MAC_CERTS }}
          OPENX_MAC_CERTS_PASSWORD: ${{ secrets.MAC_CERTS_PASSWORD }}
          OPENX_APPLE_ID: ${{ secrets.APPLE_ID }}
          OPENX_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          OPENX_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "${OPENX_MAC_CERTS:-}" ]]; then
            export CSC_LINK="$OPENX_MAC_CERTS"
            export CSC_KEY_PASSWORD="${OPENX_MAC_CERTS_PASSWORD:-}"
          else
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            echo "No macOS signing certificate configured; building unsigned packages."
          fi

          if [[ -n "${OPENX_APPLE_ID:-}" && -n "${OPENX_APPLE_APP_SPECIFIC_PASSWORD:-}" && -n "${OPENX_APPLE_TEAM_ID:-}" ]]; then
            export APPLE_ID="$OPENX_APPLE_ID"
            export APPLE_APP_SPECIFIC_PASSWORD="$OPENX_APPLE_APP_SPECIFIC_PASSWORD"
            export APPLE_TEAM_ID="$OPENX_APPLE_TEAM_ID"
          fi

          pnpm run package:mac

      - name: Build Windows packages
        if: matrix.platform == 'win'
        run: pnpm run package:win

      - name: Build Linux packages
        if: matrix.platform == 'linux'
        run: pnpm run package:linux

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.yml
            !release/builder-debug.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') == false }}
